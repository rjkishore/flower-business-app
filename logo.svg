<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
    <radialGradient id="flwr" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </radialGradient>
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffee58"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Decorative ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Corner decorative small flowers -->
  <!-- Top left -->
  <g transform="translate(68,68) scale(0.5)" opacity="0.7">
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(0)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(60)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(120)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(180)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(240)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="8" fill="#ffcc02"/>
  </g>
  <!-- Top right -->
  <g transform="translate(444,68) scale(0.5)" opacity="0.7">
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#80cbc4" transform="rotate(0)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#80cbc4" transform="rotate(60)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#80cbc4" transform="rotate(120)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#80cbc4" transform="rotate(180)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#80cbc4" transform="rotate(240)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#80cbc4" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="8" fill="#ffcc02"/>
  </g>
  <!-- Bottom left -->
  <g transform="translate(68,444) scale(0.5)" opacity="0.7">
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#80cbc4" transform="rotate(0)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#80cbc4" transform="rotate(60)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#80cbc4" transform="rotate(120)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#80cbc4" transform="rotate(180)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#80cbc4" transform="rotate(240)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#80cbc4" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="8" fill="#ffcc02"/>
  </g>
  <!-- Bottom right -->
  <g transform="translate(444,444) scale(0.5)" opacity="0.7">
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(0)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(60)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(120)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(180)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(240)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="8" fill="#ffcc02"/>
  </g>

  <!-- Main big flower in center-top area -->
  <g transform="translate(256,185)" filter="url(#shadow)">
    <!-- Petals -->
    <ellipse cx="0" cy="-52" rx="18" ry="38" fill="#fff176" transform="rotate(0)"   opacity="0.95"/>
    <ellipse cx="0" cy="-52" rx="18" ry="38" fill="#ffee58" transform="rotate(45)"  opacity="0.95"/>
    <ellipse cx="0" cy="-52" rx="18" ry="38" fill="#fff176" transform="rotate(90)"  opacity="0.95"/>
    <ellipse cx="0" cy="-52" rx="18" ry="38" fill="#ffee58" transform="rotate(135)" opacity="0.95"/>
    <ellipse cx="0" cy="-52" rx="18" ry="38" fill="#fff176" transform="rotate(180)" opacity="0.95"/>
    <ellipse cx="0" cy="-52" rx="18" ry="38" fill="#ffee58" transform="rotate(225)" opacity="0.95"/>
    <ellipse cx="0" cy="-52" rx="18" ry="38" fill="#fff176" transform="rotate(270)" opacity="0.95"/>
    <ellipse cx="0" cy="-52" rx="18" ry="38" fill="#ffee58" transform="rotate(315)" opacity="0.95"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="28" fill="url(#center)"/>
    <circle cx="0" cy="0" r="18" fill="#ff8f00" opacity="0.6"/>
    <!-- Pollen dots -->
    <circle cx="0"  cy="-10" r="3" fill="#fff9c4" opacity="0.8"/>
    <circle cx="9"  cy="5"   r="3" fill="#fff9c4" opacity="0.8"/>
    <circle cx="-9" cy="5"   r="3" fill="#fff9c4" opacity="0.8"/>
  </g>

  <!-- Leaves on sides of flower -->
  <ellipse cx="190" cy="195" rx="12" ry="28" fill="#388e3c" transform="rotate(-40,190,195)" opacity="0.9"/>
  <ellipse cx="322" cy="195" rx="12" ry="28" fill="#388e3c" transform="rotate(40,322,195)"  opacity="0.9"/>

  <!-- Decorative dots arc above flower -->
  <circle cx="180" cy="130" r="4" fill="rgba(255,255,255,0.4)"/>
  <circle cx="200" cy="112" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="256" cy="106" r="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="312" cy="112" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="332" cy="130" r="4" fill="rgba(255,255,255,0.4)"/>

  <!-- Divider line with flowers -->
  <line x1="60" y1="290" x2="452" y2="290" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <circle cx="256" cy="290" r="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="220" cy="290" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="292" cy="290" r="3" fill="rgba(255,255,255,0.3)"/>

  <!-- Tamil text: ஆறுமுகம் -->
  <text x="256" y="348"
    font-family="'Noto Sans Tamil', 'Latha', 'Tamil MN', serif"
    font-size="58"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    filter="url(#shadow)">ஆறுமுகம்</text>

  <!-- English subtitle -->
  <text x="256" y="395"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="28"
    font-weight="600"
    fill="#c8e6c9"
    text-anchor="middle"
    letter-spacing="3">FLOWER BUSINESS</text>

  <!-- Bottom decorative small flowers row -->
  <g transform="translate(140,445) scale(0.38)">
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(0)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(60)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(120)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(180)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(240)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="8" fill="#ffcc02"/>
  </g>
  <g transform="translate(256,448) scale(0.45)">
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#fff176" transform="rotate(0)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#fff176" transform="rotate(60)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#fff176" transform="rotate(120)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#fff176" transform="rotate(180)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#fff176" transform="rotate(240)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#fff176" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="8" fill="#ff8f00"/>
  </g>
  <g transform="translate(372,445) scale(0.38)">
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(0)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(60)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(120)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(180)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(240)"/>
    <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#f48fb1" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="8" fill="#ffcc02"/>
  </g>

  <!-- Bottom text -->
  <text x="256" y="492"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="18"
    fill="rgba(255,255,255,0.5)"
    text-anchor="middle"
    letter-spacing="2">🌸 மலர் வணிகம் 🌸</text>
</svg>